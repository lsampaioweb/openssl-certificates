---
- name: "Waiting for any existing lock to be released"
  ansible.builtin.import_tasks: "wait_for_lock.yml"

- name: "Writing db file with lock protection"
  block:
    - name: "Acquiring lock for db operation"
      ansible.builtin.import_tasks: "acquire_lock.yml"

    - name: "Writing updated db to file at '{{ context_vars.db_file_path }}'"
      ansible.builtin.copy:
        content: "{{ db | to_nice_json(indent=2, sort_keys=False) }}"
        dest: "{{ context_vars.db_file_path }}"
        mode: "0644"
      register: "db_write_result"

    - name: "Printing db write result"
      when: debug | bool
      ansible.builtin.debug:
        msg:
          - "db file written: {{ db_write_result.changed }}"

  always:
    - name: "Releasing lock after writing"
      ansible.builtin.import_tasks: "release_lock.yml"
