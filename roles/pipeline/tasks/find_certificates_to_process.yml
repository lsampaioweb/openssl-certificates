---
- name: "Loading certificate db from file"
  ansible.builtin.include_role:
    name: "db"
    tasks_from: "read_db.yml"

- name: "Iterating over all certificates in db"
  loop: "{{ db.certificates | dict2items | default([]) }}"
  loop_control:
    loop_var: "cert_entry"
    label: "{{ cert_entry.key }}"
  # Loop requires runtime include.
  ansible.builtin.include_tasks: "check_if_certificate_is_expiring.yml"
  vars:
    cert_key: "{{ cert_entry.key }}"
    cert_data: "{{ cert_entry.value }}"
