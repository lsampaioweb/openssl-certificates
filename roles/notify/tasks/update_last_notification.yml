---
- name: "Loading certificate db from file"
  ansible.builtin.include_role:
    name: "db"
    tasks_from: "read_db.yml"

- name: "Updating last notification timestamp for certificate '{{ certificate_path }}'"
  ansible.builtin.set_fact:
    db: >-
      {{ db | combine({
          'last_updated': now(utc=true, fmt=context_vars.certificate_datetime_format),
          'certificates': db.certificates | combine({
              (certificate_path): cert_data | combine({
                'last_notification': now(utc=true, fmt=context_vars.certificate_datetime_format)
              })
            })
        }, recursive=True) }}
  vars:
    # Reconstructing cert_data from db since original was lost between phases.
    cert_data: "{{ db.certificates[certificate_path] | default({}) }}"

- name: "Saving updated db to file"
  ansible.builtin.include_role:
    name: "db"
    tasks_from: "write_db.yml"
